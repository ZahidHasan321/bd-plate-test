[project]
name = "plate-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fast-alpr[onnx]>=0.4.0",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "opencv-python-headless>=5.0.0.93",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
export = ["ultralytics>=8.3.228", "torch", "torchvision", "onnx", "onnxslim", "dill"]

[tool.uv]
default-groups = []

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
