<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plate Test</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
  header { padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, label.btn, select { background: #2d6cdf; color: #fff; border: 0; border-radius: 6px; padding: 10px 14px; font-size: 15px; }
  select { background: #222; border: 1px solid #444; max-width: 100%; }
  button:disabled { opacity: .4; }
  button.small { padding: 6px 10px; font-size: 13px; background: #333; }
  #note { padding: 0 16px; font-size: 13px; color: #aaa; }
  #credit { padding: 2px 16px 0; font-size: 12px; color: #9a9a9a; }
  main { display: grid; gap: 0 16px; }
  @media (min-width: 900px) { main { grid-template-columns: 1fr 400px; } }
  [hidden] { display: none !important; }
  #stage { position: relative; width: fit-content; max-width: 100%; margin: 0 auto; }
  #stage video, #stage img { display: block; max-width: 100%; max-height: 70vh; width: auto; height: auto; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #stats { padding: 6px 16px; font-size: 13px; color: #aaa; }
  #plates { padding: 0 16px 16px; }
  .plate { font-size: 20px; font-family: monospace; margin: 8px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .plate img { height: 64px; max-width: 220px; object-fit: contain; background: #000; border-radius: 4px; }
  .bn { font-family: system-ui, sans-serif; }
  .plate small { font-size: 13px; color: #aaa; }
  .ok { color: #3f3; } .bad { color: #f93; }
  table { border-collapse: collapse; margin: 0 16px 16px; font-size: 14px; }
  td, th { border-bottom: 1px solid #333; padding: 6px 8px; text-align: left; vertical-align: top; }
  .wrap { overflow-x: auto; }
  aside { padding: 0 16px 16px; }
  aside h2 { font-size: 16px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; }
  .car { display: grid; grid-template-columns: 120px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid #333; }
  .car img { width: 120px; height: 60px; object-fit: contain; background: #000; border-radius: 4px; }
  .car .num { font-family: monospace; font-size: 17px; }
  .car .meta { font-size: 12px; color: #aaa; margin-top: 2px; }
  .badge { font-size: 12px; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
  .b-ok { background: #1f5f2a; } .b-review { background: #7a4a00; } .b-done { background: #234a8a; }
  .car .actions { margin-top: 6px; display: flex; gap: 6px; }
  #empty { color: #888; font-size: 14px; }
</style>
</head>
<body>
<header>
  <select id="pipeline" aria-label="Model">
    {% for label, items in groups if items %}<optgroup label="{{ label }}">
      {% for p in items %}<option value="{{ p.name }}" data-note="{{ p.note }}">{{ '★ ' if p.tag == 'recommended' }}{{ p.name }}</option>{% endfor %}
    </optgroup>{% endfor %}
  </select>
  <select id="sample" aria-label="Sample">
    <option value="">Try a sample…</option>
    <optgroup label="Videos">{% for f in samples.videos %}<option value="videos/{{ f }}">▶ {{ f.rsplit('.', 1)[0].replace('_', ' ') }}</option>{% endfor %}</optgroup>
    <optgroup label="Photos">{% for f in samples.photos %}<option value="photos/{{ f }}">{{ f.rsplit('.', 1)[0].replace('_', ' ') }}</option>{% endfor %}</optgroup>
  </select>
  <button id="live">Camera</button>
  <label class="btn">Video<input id="file" type="file" accept="video/*" hidden></label>
  <label class="btn">Photo<input id="photo" type="file" accept="image/*" capture="environment" hidden></label>
  <button id="compare" disabled>Compare all</button>
</header>
<div id="note"></div>
<div id="credit">Samples: NightLPBD (Hasan &amp; Ahsan, CC BY 4.0) and Bangladesh Vehicle Number Plate Detection Dataset (CC BY 4.0); videos are built from these photos.</div>
<main>
  <section>
    <div id="stage">
      <video id="video" playsinline muted hidden></video>
      <canvas id="overlay"></canvas>
    </div>
    <div id="stats"></div>
    <div id="plates"></div>
    <div class="wrap"><table id="table" hidden></table></div>
  </section>
  <aside>
    <h2><span>Vehicles <span id="source-name" class="meta"></span></span><button class="small" id="clear">Clear</button></h2>
    <div id="cars"><div id="empty">Start the camera or a video — each vehicle appears here once, and its reading improves as it stays in view.</div></div>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
const video = $('video'), overlay = $('overlay'), select = $('pipeline');
const still = document.createElement('img');
still.hidden = true;
video.after(still);
const grab = document.createElement('canvas');
let running = false, lastBlob = null, source = 'phone', run = 0;  // run: ignore answers from a stopped loop

try { const saved = localStorage.getItem('pipeline'); if (saved) select.value = saved; } catch {}
const showNote = () => $('note').textContent = select.selectedOptions[0].dataset.note;
select.onchange = () => { try { localStorage.setItem('pipeline', select.value); } catch {} showNote(); };
showNote();

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

async function post(url, blob) {
  const form = new FormData();
  form.append('image', blob, 'frame.jpg');
  const t0 = performance.now();
  const res = await fetch(url, { method: 'POST', body: form });
  if (!res.ok) throw new Error(await res.text());
  const data = await res.json();
  data.roundtrip = Math.round(performance.now() - t0);
  return data;
}

const plateText = (p) =>
  `<span class="${p.valid ? 'ok' : 'bad'}">${esc(p.text) || '?'}</span>` + (p.bangla ? ` <span class="bn">${esc(p.bangla)}</span>` : '');

function show(data, el) {
  const r = el.getBoundingClientRect();
  overlay.width = r.width; overlay.height = r.height;
  const sx = r.width / data.width, sy = r.height / data.height;
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  ctx.lineWidth = 3; ctx.font = 'bold 16px monospace';
  for (const p of data.plates) {
    const [x1, y1, x2, y2] = p.box;
    ctx.strokeStyle = ctx.fillStyle = p.valid ? '#3f3' : '#f93';
    ctx.strokeRect(x1 * sx, y1 * sy, (x2 - x1) * sx, (y2 - y1) * sy);
    ctx.fillText(p.text || '?', x1 * sx, Math.max(16, y1 * sy - 6));
  }
  $('stats').textContent = `${data.pipeline} · ${data.width}x${data.height} · detect ${data.ms.detect} ms · read ${data.ms.read} ms · round trip ${data.roundtrip} ms`;
  $('plates').innerHTML = data.plates.map(p =>
    `<div class="plate">${p.crop_jpg ? `<img src="data:image/jpeg;base64,${p.crop_jpg}" alt="plate crop">` : ''}
      <div>${plateText(p)}<br><small>det ${p.det_conf} · read ${p.conf ?? '-'}</small></div></div>`).join('');
}

function showTable(data) {
  const rows = data.results.map(r => `<tr><td>${r.pipeline}</td>
    <td>${r.plates.map(plateText).join('<br>') || '-'}</td>
    <td>${r.ms.detect}</td><td>${r.ms.read}</td></tr>`).join('');
  $('table').innerHTML = `<tr><th>pipeline</th><th>reading</th><th>detect ms</th><th>read ms</th></tr>${rows}`;
  $('table').hidden = false;
}

// ---------------------------------------------------------------- vehicles list
const time = (t) => new Date(t * 1000).toLocaleTimeString();
async function refreshCars() {
  $('source-name').textContent = `· ${source}`;
  let cars;
  try { cars = await (await fetch(`/vehicles?source=${source}`)).json(); } catch { return; }
  if (!cars.length) return;
  $('cars').innerHTML = cars.map(c => {
    const badge = c.reviewed ? '<span class="badge b-done">confirmed</span>'
      : c.status === 'ok' ? '<span class="badge b-ok">read</span>' : '<span class="badge b-review">needs review</span>';
    const shown = c.reviewed ? c.reviewed_plate : c.plate;
    return `<div class="car">
      <img src="/${esc(c.crop)}?v=${c.last_seen}" alt="plate ${esc(shown)}">
      <div>
        <div class="num">${esc(shown) || '?'}${badge}</div>
        <div class="bn">${c.reviewed ? '' : esc(c.bangla)}</div>
        <div class="meta">${time(c.first_seen)} – ${time(c.last_seen)} · ${c.votes}/${c.readings} readings agree</div>
        <div class="actions">
          <button class="small" data-id="${c.id}" data-act="ok">✓ Correct</button>
          <button class="small" data-id="${c.id}" data-act="fix" data-plate="${esc(shown)}">✎ Fix</button>
        </div>
      </div></div>`;
  }).join('');
}
$('cars').onclick = async (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  let plate = '';
  if (b.dataset.act === 'fix') {
    plate = prompt('Correct plate (e.g. DHAKA METRO-GA 12-3456):', b.dataset.plate);
    if (!plate) return;
  }
  const form = new FormData(); form.append('plate', plate);
  await fetch(`/vehicles/${b.dataset.id}`, { method: 'POST', body: form });
  refreshCars();
};
$('clear').onclick = async () => {
  if (!confirm(`Clear the ${source} vehicle list?`)) return;
  await fetch(`/vehicles?source=${source}`, { method: 'DELETE' });
  $('cars').innerHTML = '<div id="empty">Cleared.</div>';
};
setInterval(() => { if (running) refreshCars(); }, 1500);
refreshCars();

// ---------------------------------------------------------------- capture loop (camera or video file)
async function frameBlob() {
  const scale = Math.min(1, 1920 / video.videoWidth);
  grab.width = video.videoWidth * scale; grab.height = video.videoHeight * scale;
  grab.getContext('2d').drawImage(video, 0, 0, grab.width, grab.height);
  return new Promise(r => grab.toBlob(r, 'image/jpeg', 0.92));
}

async function loop() {
  const mine = ++run;
  while (running && mine === run) {
    if (video.paused || video.ended) { await new Promise(r => setTimeout(r, 200)); continue; }
    lastBlob = await frameBlob();
    $('compare').disabled = false;
    try {
      const data = await post(`/predict?pipeline=${select.value}&source=${source}`, lastBlob);
      if (running && mine === run) show(data, video);
    } catch (e) { $('stats').textContent = e; }
  }
}

function stop() {
  if (running) fetch(`/close?source=${source}`, { method: 'POST' }).then(refreshCars);
  running = false;
  run++;
  if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
  video.pause();
  $('live').textContent = 'Camera';
  refreshCars();
}

function start(src) {
  source = src;
  still.hidden = true; video.hidden = false;
  running = true;
  refreshCars();
  loop();
}

$('live').onclick = async () => {
  if (running) return stop();
  video.removeAttribute('src');
  video.srcObject = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
  await video.play();
  $('live').textContent = 'Stop';
  start('phone');
};

async function playVideo(url) {
  stop();
  video.src = url;
  video.controls = true;
  video.onended = () => { setTimeout(stop, 2000); };
  await video.play();
  $('live').textContent = 'Stop';
  start('video');
}

async function runPhoto(blob, url) {
  stop();
  lastBlob = blob;
  $('compare').disabled = false;
  still.src = url;
  await still.decode();
  video.hidden = true; still.hidden = false;
  show(await post(`/predict?pipeline=${select.value}`, blob), still);
}

$('sample').onchange = async (e) => {
  const path = e.target.value;
  e.target.value = '';
  if (!path) return;
  if (path.startsWith('videos/')) return playVideo(`/samples/${path}`);
  const blob = await (await fetch(`/samples/${path}`)).blob();
  runPhoto(blob, URL.createObjectURL(blob));
};

$('file').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  stop();
  video.src = URL.createObjectURL(file);
  video.controls = true;
  video.onended = () => { setTimeout(stop, 2000); };
  await video.play();
  $('live').textContent = 'Stop';
  start('video');
};

$('photo').onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  stop();
  lastBlob = file;
  $('compare').disabled = false;
  still.src = URL.createObjectURL(file);
  await still.decode();
  video.hidden = true; still.hidden = false;
  show(await post(`/predict?pipeline=${select.value}`, file), still);
};

$('compare').onclick = async (e) => {
  if (!lastBlob) return;
  e.target.disabled = true; e.target.textContent = 'Comparing…';
  try { showTable(await post('/compare', lastBlob)); }
  catch (err) { $('stats').textContent = err; }
  e.target.disabled = false; e.target.textContent = 'Compare all';
};
</script>
</body>
</html>
